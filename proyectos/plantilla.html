<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Adharma | {title}</title>

    <link rel="icon" href="/src/images/logo/favicon.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/styleproyectos.css">
    <link rel="stylesheet" href="/src/footer.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script type="module" src="/appSubpagina.js"></script>
    <script src="/src/recomendados.js"></script> <!-- Asegúrate de cargar el archivo JavaScript -->

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body id="content" class="main">

    <main id="contenidoPrincipal">
        <script>
            function ajustarContenido() {
                if (window.innerWidth > window.innerHeight) {
                    document.getElementById('contenidoHorizontal').style.display = 'flex';
                    document.getElementById('contenidoVertical').style.display = 'none';
                } else {
                    document.getElementById('contenidoHorizontal').style.display = 'none';
                    document.getElementById('contenidoVertical').style.display = 'flex';
                }
            }

            window.addEventListener('resize', ajustarContenido);
            window.addEventListener('load', ajustarContenido);
        </script>

        <!-- Contenido para pantallas horizontales -->
        <div id="contenidoHorizontal" style="display:none;">

            <nav id="nav" class="bottom-navbar navbar navbar-light">
                <div class="container-fluid d-flex justify-content-center align-items-center">
                    <div class="d-flex justify-content-between align-items-center w-100">
                        <div class="navbar-brand m-0">
                            <a href="/index.html" id="logo-link">
                                <img src="/src/images/logo/adhr_black.svg" id="logo-img" alt="Logo" class="d-inline-block align-text-top">
                            </a>
                        </div>
                    </div>
                </div>
            </nav>

            <header id="subpagina" class="container-fluid d-flex justify-content-center">
                <div class="video-container-detail">
                    <video class="videoSrc" ="videoSrc" src="{videoSrc}" controls preload="auto"></video>

                    <div class="text-container">
                        <p id="tituloProyecto"><br></p>
                        <h1>{title}</h1>
                        <p id="categoriaProyecto"></p>
                        <h2>{category}</h2>
                    </div>

                    <section id="credits-container" class="credits">
                        <h2>Créditos</h2>
                        <ul id="creditosProyecto">
                            {credits}
                        </ul>
                    </section>

                    <script>
                        document.addEventListener("DOMContentLoaded", function() {
                            const urlParams = new URLSearchParams(window.location.search);
                            const projectId = urlParams.get('id');
                    
                            fetch('/proyectos/proyectos.json')
                                .then(response => response.json())
                                .then(data => {
                                    const project = data.projects.find(p => p.id === projectId);
                                    if (project) {
                                        let htmlTemplate = document.documentElement.outerHTML;
                    
                                        htmlTemplate = htmlTemplate.replace(/{title}/g, project.title);
                                        htmlTemplate = htmlTemplate.replace(/{category}/g, project.category);
                                        htmlTemplate = htmlTemplate.replace(/{videoSrc}/g, project.videoSrc);
                    
                                        let creditsHtml = '';
                                        for (let role in project.credits) {
                                            creditsHtml += `<p><strong>${role}:</strong> ${project.credits[role]}</p>`;
                                        }
                                        htmlTemplate = htmlTemplate.replace(/{credits}/g, creditsHtml);
                    
                                        document.open();
                                        document.write(htmlTemplate);
                                        document.close();
                                    } else {
                                        console.error("Proyecto no encontrado");
                                    }
                                })
                                .catch(error => console.log("Error al cargar el JSON:", error));
                        });
                    </script>

                    
                </div>
            </header>
        </div>
        <!-- Contenido para pantallas verticales -->
        <div id="contenidoVertical" style="display:none;">
            <nav id="nav" class="bottom-navbar navbar navbar-light">
                <div class="container-fluid d-flex justify-content-center align-items-center">
                    <div class="d-flex justify-content-between align-items-center w-100">
                        <div class="navbar-brand m-0">
                            <a href="/index.html" id="logo-link">
                                <img src="/src/images/logo/adhr_black.svg" id="logo-img" alt="Logo" class="d-inline-block align-text-top">
                            </a>
                        </div>
                    </div>
                </div>
            </nav>

            <header id="subpaginaVertical">
                <video id="videoSubpagina" controls preload="auto"></video>
                <div class="text-container">
                    <p id="tituloVertical"><b></b><br></p>
                </div>

                <section class="creditsMovil">
                    <p id="creditsCollectionVertical" class="subtitle"></p>
                    <p id="creditsProducedByVertical"></p>
                    <p id="creditsStarringVertical"></p>
                    <ul id="creditosMovilLista"></ul>
                </section>
            </header>
        </div>

        <section id="recomendados" class="container-fluid d-flex flex-column align-items-center">
            <h2 class="text-center mb-4">Recomendados</h2>
            <div class="row justify-content-center gap-4" id="video-container"></div>
        </section>

    </main>

    <footer>
        <div class="footer-container d-flex justify-content-between">
            <div class="d-flex flex-column align-items-start">
                <h1 class="footer-lettering">adharma</h1>
                <p class="footer-copy">© 2025 magicians. Todos los derechos reservados.</p>
            </div>
            <div class="d-flex flex-column align-items-end footer-social">
                <a href="https://instagram.com/adharma.collective" target="_blank" aria-label="Instagram">
                    <img src="/src/Images/logo/instagram.svg" alt="Instagram" />
                </a>
                <a href="mailto:info@adharma.es?subject=Consulta%20sobre%20producción%20de%20videos">
                    <img src="/src/Images/logo/mailto.svg" alt="Enviar correo">
                </a>
            </div>
        </div>
    </footer>
</body>

</html>
